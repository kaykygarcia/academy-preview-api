
name: Preview Controller

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_run:
    workflows: [Preview Build]
    types: [completed]

permissions: {}

jobs:
  delete-preview:
    name: Delete PR preview
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      deployments: write

    steps:
      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::181975986962:role/AcademyPreviewControllerRole
          aws-region: us-east-1

      - name: Delete preview service
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ECS_CLUSTER: academy-preview-cluster
        shell: bash
        run: |
          set -euo pipefail

          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1

          SERVICE="academy-preview-pr-${PR_NUMBER}"
          echo "Cleaning up $SERVICE"

          if ! aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE" \
            --output json > service.json 2> error.log; then

            if grep -q 'ClusterNotFoundException' error.log; then
              echo "Cluster already removed. Nothing to delete."
              exit 0
            fi

            cat error.log >&2
            exit 1
          fi

          STATUS=$(jq -r '.services[0].status // "MISSING"' service.json)

          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs delete-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE" \
              --force \
              --query 'service.{Name:serviceName,Status:status,Desired:desiredCount}' \
              --output json

            echo "Deletion requested for $SERVICE"
          else
            echo "Service already absent or inactive: $STATUS"
          fi

      - name: Mark GitHub preview deployments inactive
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const environment = `preview-pr-${process.env.PR_NUMBER}`;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {owner, repo, environment, per_page: 100}
            );

            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner, repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'PR closed; preview removed'
              });
            }

  resolve-artifact:
    name: Resolve PR preview artifact
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      pr: ${{ steps.verify.outputs.pr }}
      sha: ${{ steps.verify.outputs.sha }}
      artifact_id: ${{ steps.verify.outputs.artifact_id }}
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pull-requests: read

    steps:
      - name: Locate and verify preview artifact
        id: verify
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            if (run.head_repository?.full_name !== `${owner}/${repo}`) {
              core.info('Build from another repository. Skipping.');
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: run.id,
              per_page: 100
            });

            const matches = data.artifacts
              .map(artifact => ({
                artifact,
                match: /^preview-image-pr-(\d+)-([a-f0-9]{40})$/.exec(artifact.name)
              }))
              .filter(item => item.match && !item.artifact.expired);

            if (matches.length !== 1) {
              core.setFailed('Expected exactly one valid preview artifact.');
              return;
            }

            const { artifact, match } = matches[0];
            const prNumber = Number(match[1]);
            const sha = match[2];

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            if (pr.head.repo?.full_name !== `${owner}/${repo}` ||
                pr.base.ref !== 'main') {
              core.setFailed('Unexpected PR repository or base branch.');
              return;
            }

            if (pr.state !== 'open') {
              core.info('PR already closed. Skipping preview.');
              return;
            }

            if (pr.head.sha !== sha) {
              core.info('Artifact belongs to an outdated commit. Skipping.');
              return;
            }

            core.info(`PR #${prNumber} verified`);
            core.info(`Commit: ${sha}`);
            core.info(`Artifact: ${artifact.name}`);
            core.info(`Artifact ID: ${artifact.id}`);
            core.setOutput('ready', 'true');
            core.setOutput('pr', String(prNumber));
            core.setOutput('sha', sha);
            core.setOutput('artifact_id', String(artifact.id));

            core.info('READY for next publication stage');

  publish-preview-image:
    name: Publish PR image to ECR
    needs: resolve-artifact
    if: needs.resolve-artifact.outputs.ready == 'true'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.resolve-artifact.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preview

      - name: Validate and load Docker image
        env:
          PR_NUMBER: ${{ needs.resolve-artifact.outputs.pr }}
        run: |
          set -euo pipefail

          echo "Downloaded files:"
          find "$RUNNER_TEMP/preview" -maxdepth 3 -type f -print

          mapfile -d '' ARCHIVES < <(
            find "$RUNNER_TEMP/preview" \
              -type f \
              -name 'preview-image.tar.gz' \
              -print0
          )

          if [ "${#ARCHIVES[@]}" -ne 1 ]; then
            echo "Expected one image archive." >&2
            exit 1
          fi

          ARCHIVE="${ARCHIVES[0]}"
          gzip -t "$ARCHIVE"
          gzip -dc "$ARCHIVE" | docker load

          docker image inspect \
            "academy-preview-api:pr-${PR_NUMBER}" > /dev/null

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::181975986962:role/AcademyEcrPublisherRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish image
        env:
          PR_NUMBER: ${{ needs.resolve-artifact.outputs.pr }}
          PR_SHA: ${{ needs.resolve-artifact.outputs.sha }}
        run: |
          set -euo pipefail

          REPOSITORY="academy-preview-api"
          REGISTRY="181975986962.dkr.ecr.us-east-1.amazonaws.com"
          TAG="pr-${PR_NUMBER}-${PR_SHA}"
          IMAGE_URI="${REGISTRY}/${REPOSITORY}:${TAG}"

          EXISTING=$(aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=${TAG}" \
            --query 'images[0].imageId.imageDigest' \
            --output text)

          if [ "$EXISTING" != "None" ]; then
            echo "Image already published: $IMAGE_URI"
            exit 0
          fi

          docker tag \
            "academy-preview-api:pr-${PR_NUMBER}" \
            "$IMAGE_URI"

          docker push "$IMAGE_URI"

          echo "Published: $IMAGE_URI"

  deploy-preview:
    name: Create or update PR preview
    needs: [resolve-artifact, publish-preview-image]
    if: needs.resolve-artifact.outputs.ready == 'true' && needs.publish-preview-image.result == 'success'
    runs-on: ubuntu-latest

    concurrency:
      group: preview-pr-${{ needs.resolve-artifact.outputs.pr }}
      cancel-in-progress: false

    permissions:
      id-token: write
      pull-requests: read
      deployments: write

    env:
      PR_NUMBER: ${{ needs.resolve-artifact.outputs.pr }}
      PR_SHA: ${{ needs.resolve-artifact.outputs.sha }}
      ECS_CLUSTER: academy-preview-cluster
      ECS_SERVICE: academy-preview-api

    steps:
      - name: Check PR is still open and current
        id: current
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = process.env.PR_SHA;
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber
            });

            const valid = pr.state === 'open' &&
              pr.head.sha === sha &&
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              pr.base.ref === 'main';

            core.setOutput('ok', valid ? 'true' : 'false');
            core.info(valid ? 'PR confirmed' : 'PR closed or outdated; skipping');
        env:
          PR_NUMBER: ${{ needs.resolve-artifact.outputs.pr }}
          PR_SHA: ${{ needs.resolve-artifact.outputs.sha }}

      - name: Authenticate to AWS
        if: steps.current.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::181975986962:role/AcademyEcsDeployerRole
          aws-region: us-east-1

      - name: Create or update ECS preview
        id: ecs_deploy
        if: steps.current.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(aws ecs describe-clusters --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].status' --output text)

          if [ "$STATUS" != 'ACTIVE' ]; then
            echo 'Shared ECS cluster is not active. Skipping.'
            exit 0
          fi

          BASE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" --query 'services[0]' --output json)

          BASE_TASK=$(jq -r '.taskDefinition // empty' <<< "$BASE")
          NETWORK=$(jq -c '.networkConfiguration // empty' <<< "$BASE")

          if [ -z "$BASE_TASK" ] || [ -z "$NETWORK" ]; then
            echo 'Base service missing. Skipping.'
            exit 0
          fi

          DIGEST=$(aws ecr describe-images \
            --repository-name academy-preview-api \
            --image-ids "imageTag=pr-${PR_NUMBER}-${PR_SHA}" \
            --query 'imageDetails[0].imageDigest' --output text)

          IMAGE="181975986962.dkr.ecr.us-east-1.amazonaws.com/academy-preview-api@${DIGEST}"
          SERVICE="academy-preview-pr-${PR_NUMBER}"
          FAMILY="academy-preview-api-pr-${PR_NUMBER}"

          SERVICE_STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services "$SERVICE" --query 'services[0].status' --output text)

          if [ "$SERVICE_STATUS" = 'DRAINING' ]; then
            echo 'Previous preview deletion still in progress.' >&2
            exit 1
          fi

          if [ "$SERVICE_STATUS" = 'ACTIVE' ]; then
            CURRENT=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
              --services "$SERVICE" --query 'services[0].taskDefinition' --output text)

            CURRENT_IMAGE=$(aws ecs describe-task-definition --task-definition "$CURRENT" \
              --query 'taskDefinition.containerDefinitions[0].image' --output text)

            if [ "$CURRENT_IMAGE" = "$IMAGE" ]; then
              echo 'Image already deployed. Ensuring desired count is 1.'
              aws ecs update-service --cluster "$ECS_CLUSTER" \
                --service "$SERVICE" --desired-count 1 > /dev/null

              aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$SERVICE"
              echo "Preview ready: $SERVICE"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          aws ecs describe-task-definition --task-definition "$BASE_TASK" \
            --query taskDefinition --output json |
          jq --arg image "$IMAGE" --arg family "$FAMILY" --arg env "pr-${PR_NUMBER}" '
            {
              family: $family, taskRoleArn, executionRoleArn, networkMode,
              containerDefinitions, volumes, placementConstraints,
              requiresCompatibilities, cpu, memory, runtimePlatform, ephemeralStorage
            }
            | with_entries(select(.value != null))
            | .containerDefinitions |= map(
                if .name == "api" then
                  .image = $image |
                  .environment = (
                    ((.environment // []) | map(select(.name != "APP_ENV"))) +
                    [{name: "APP_ENV", value: $env}]
                  )
                else . end
              )
          ' > /tmp/preview-task.json

          NEW_TASK=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/preview-task.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          if [ "$SERVICE_STATUS" = 'ACTIVE' ]; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE" \
              --task-definition "$NEW_TASK" \
              --desired-count 1 > /dev/null
          else
            aws ecs create-service \
              --cluster "$ECS_CLUSTER" \
              --service-name "$SERVICE" \
              --task-definition "$NEW_TASK" \
              --launch-type FARGATE \
              --desired-count 1 \
              --network-configuration "$NETWORK" \
              --deployment-configuration 'deploymentCircuitBreaker={enable=true,rollback=true}' > /dev/null
          fi

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$SERVICE"

          echo "Preview deployed: $SERVICE"
          echo "Image: $IMAGE"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Discover preview URL
        id: preview_url
        if: steps.ecs_deploy.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          SERVICE="academy-preview-pr-${PR_NUMBER}"

          TASK_ARN=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "No running task found" >&2
            exit 1
          fi

          TASK=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0]' --output json)

          HEALTH=$(jq -r '.healthStatus' <<< "$TASK")

          for attempt in $(seq 1 18); do
            if [ "$HEALTH" = "HEALTHY" ]; then
              echo "Task is healthy."
              break
            fi

            if [ "$HEALTH" = "UNHEALTHY" ]; then
              echo "Task is unhealthy." >&2
              exit 1
            fi

            echo "Waiting for health check ($attempt/18): $HEALTH"
            sleep 5

            TASK=$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0]' --output json)

            HEALTH=$(jq -r '.healthStatus' <<< "$TASK")
          done

          if [ "$HEALTH" != "HEALTHY" ]; then
            echo "Health check timed out: $HEALTH" >&2
            exit 1
          fi

          ENI_ID=$(jq -r '
            [.attachments[].details[] |
             select(.name == "networkInterfaceId") |
             .value][0] // empty' <<< "$TASK")

          test -n "$ENI_ID"

          IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Association.PublicIp' \
            --output text)

          test -n "$IP"
          test "$IP" != "None"

          URL="http://${IP}:3000"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"

      - name: Publish GitHub deployment
        if: steps.preview_url.outputs.url != ''
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ needs.resolve-artifact.outputs.pr }}
          PR_SHA: ${{ needs.resolve-artifact.outputs.sha }}
          PREVIEW_URL: ${{ steps.preview_url.outputs.url }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const environment = `preview-pr-${process.env.PR_NUMBER}`;

            const {data: pr} = await github.rest.pulls.get({
              owner, repo,
              pull_number: Number(process.env.PR_NUMBER)
            });

            if (pr.state !== 'open' ||
                pr.head.sha !== process.env.PR_SHA) {
              core.info('PR closed or changed; skipping deployment record');
              return;
            }

            const {data: deployment} =
              await github.rest.repos.createDeployment({
                owner, repo,
                ref: process.env.PR_SHA,
                environment,
                auto_merge: false,
                required_contexts: [],
                transient_environment: true,
                production_environment: false,
                description: `Preview for PR #${process.env.PR_NUMBER}`
              });

            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: process.env.PREVIEW_URL,
              description: 'ECS preview healthy'
            });

            core.info(`GitHub deployment ready: ${process.env.PREVIEW_URL}`);
