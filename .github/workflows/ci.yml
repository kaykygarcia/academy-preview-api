name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t academy-preview-api:ci .
  publish-to-ecr:
    name: Publish image to ECR
    needs: [test-and-build, terraform-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::181975986962:role/AcademyEcrPublisherRole
          aws-region: us-east-1

      - name: Verify assumed identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: academy-preview-api
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build --pull \
            --build-arg BUILD_REVISION="$GITHUB_SHA" \
            -t "$IMAGE_URI" .

          docker push "$IMAGE_URI"

          echo "Published image: $IMAGE_URI"
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.2'

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate
  deploy-to-ecs:
    name: Deploy to ECS
    needs: publish-to-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      ECS_CLUSTER: academy-preview-cluster
      ECS_SERVICE: academy-preview-api
      ECR_REPOSITORY: academy-preview-api
      AWS_REGION: us-east-1

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::181975986962:role/AcademyEcsDeployerRole
          aws-region: us-east-1

      - name: Check whether ECS service exists
        id: service
        shell: bash
        run: |
          set -euo pipefail

          if ! aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json > service.json 2> service-error.log; then

            if grep -q 'ClusterNotFoundException' service-error.log; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "ECS cluster absent. Deployment skipped."
              exit 0
            fi

            cat service-error.log >&2
            exit 1
          fi

          TASK_DEFINITION=$(jq -r \
            '.services[] | select(.status == "ACTIVE") | .taskDefinition' \
            service.json)

          if [ -z "$TASK_DEFINITION" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ECS service absent. Deployment skipped."
            exit 0
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Resolve published image digest
        if: steps.service.outputs.exists == 'true'
        id: image
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=sha-${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          IMAGE_URI="181975986962.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY@$DIGEST"

          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Deploying image: $IMAGE_URI"

      - name: Register new task definition
        if: steps.service.outputs.exists == 'true'
        id: task
        env:
          CURRENT_TASK: ${{ steps.service.outputs.task_definition }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK" \
            --query taskDefinition \
            --output json > current-task.json

          jq --arg image "$IMAGE_URI" '
            {
              family,
              taskRoleArn,
              executionRoleArn,
              networkMode,
              containerDefinitions,
              volumes,
              placementConstraints,
              requiresCompatibilities,
              cpu,
              memory,
              runtimePlatform,
              ephemeralStorage
            }
            | with_entries(select(.value != null))
            | .containerDefinitions |= map(
                if .name == "api" then .image = $image else . end
              )
          ' current-task.json > next-task.json

          NEW_TASK=$(aws ecs register-task-definition \
            --cli-input-json file://next-task.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=$NEW_TASK" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify
        if: steps.service.outputs.exists == 'true'
        env:
          NEW_TASK: ${{ steps.task.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK" > /dev/null

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          ACTIVE_TASK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ "$ACTIVE_TASK" != "$NEW_TASK" ]; then
            echo "Deployment did not finish on the expected task revision."
            exit 1
          fi

          echo "Deployment successful: $ACTIVE_TASK"
